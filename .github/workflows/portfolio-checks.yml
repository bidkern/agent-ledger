name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3260
      AUTH_STRATEGY: access-code
      ENABLE_ENTERPRISE_SSO: "false"
      ENABLE_LOCAL_DEMO: "false"
      APP_ACCESS_CODE: local-ci-access-code
      APP_ACCESS_EMAILS: owner@example.com
      SESSION_SECRET: local-ci-session-secret-at-least-32-chars
      AGENT_LEDGER_VAULT_KEY: local-ci-vault-key-at-least-32-chars
      SERVICE_ACCOUNT_TOKENS: local-ci-service-token
      STORAGE_BACKEND: filesystem
      AGENT_LEDGER_ALLOW_METERED_API: "false"
      ENABLE_RUNTIME_OAUTH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
